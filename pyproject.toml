[project]
name = "filesystem-object-enumerator"
version = "0.1.0"
description = "Walks a directory tree once, yielding each entry's absolute path, relative path, kind, and size."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
